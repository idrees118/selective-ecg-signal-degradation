label_confidence_id: ptbxl_annotation_confidence_v1

source:
  dataset: PTB-XL
  version: 1.0.3
  field: scp_codes

interpretation:
  name: annotation_confidence
  not_inter_rater_reliability: true
  likelihood_zero_means_unknown: true
  validated_by_used_as_confidence: false
  validated_by_human_used_as_score: false
  second_opinion_used_as_score: false
  initial_autogenerated_report_used_as_score: false

superclass_score:
  apply_to: positive_superclasses_only
  constituent_code_aggregation: maximum_known_likelihood
  justification: superclass_target_is_logical_OR_of_constituent_diagnostic_codes
  likelihood_scale: divide_by_100

record_score:
  aggregation: arithmetic_mean_of_available_positive_superclass_scores
  direction: higher_means_more_confident

ambiguity_score:
  formula: 1_minus_label_confidence
  direction: higher_means_more_ambiguous

missingness:
  zero_likelihood: unavailable_not_zero_confidence
  save_coverage_fraction: true
  no_known_superclass_likelihood:
    strategy: validation_median_imputation
    flag_imputed_records: true

development_split:
  validation_only: true

test_allowed_during_development: false

status: FROZEN
